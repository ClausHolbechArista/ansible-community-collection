# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
ci:
  autoupdate_commit_msg: "CI: pre-commit autoupdate"
  skip: [pyright]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: Trims trailing whitespace.
        exclude: ansible_collections/arista/community/molecule
      - id: end-of-file-fixer
        name: Ensures that a file is either empty, or ends with one newline.
        exclude_types: [svg, json]
        exclude: ansible_collections/arista/community/molecule
      - id: check-added-large-files
        name: Prevents giant files from being committed.
        exclude: >-
          ansible_collections/arista/community/molecule
      - id: check-merge-conflict
        name: Checks for files that contain merge conflict strings.
        exclude: ansible_collections/arista/community/molecule

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: insert-license
        name: Check and insert license on Python files.
        exclude: ansible_collections/arista/community/(plugins/module_utils|tests/unit(/module_utils|/modules|))/__init__.py
        files: .*\.pyi?$
        args:
          - --license-filepath
          - development/license-short.txt
          - --use-current-year
          - --allow-past-years
          - --fuzzy-match-generates-todo
          - --no-extra-eol

      - id: insert-license
        name: Check and insert license on select YAML files.
        files: ansible_collections/arista/community/roles/.*/(handlers|schemas|tasks)/.*\.yml$
        args:
          - --license-filepath
          - development/license-short.txt
          - --use-current-year
          - --allow-past-years
          - --fuzzy-match-generates-todo
          - --no-extra-eol

      - id: insert-license
        name: Check and insert license on Jinja2 files.
        files: .*\.j2$
        exclude: ansible_collections/arista/community/molecule.*
        args:
          - --license-filepath
          - development/license-short.txt
          - --use-current-year
          - --allow-past-years
          - --fuzzy-match-generates-todo
          - --comment-style
          - '{#||#}'
          - --no-extra-eol

      - id: insert-license
        name: Check and insert license on Markdown files.
        files: .*\.md$
        exclude: (ansible_collections/arista/community/molecule|.github).*
        args:
          - --license-filepath
          - development/license-short.txt
          - --use-current-year
          - --allow-past-years
          - --fuzzy-match-generates-todo
          - --comment-style
          - '<!--|  ~|  -->'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.12.7
    hooks:
      # Run the linter.
      - id: ruff
        args:
          - --fix
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.403
    hooks:
      - id: pyright
        name: PyRight static type checker
        types: [python]
        additional_dependencies:
          - 'anta==1.4.0'
          - 'ansible-core>=2.16.0,<2.19.0'
          - 'deepmerge>=1.1.0'
          - 'PyYAML>=6.0.0'
          - 'ruff==0.11.11'

  - repo: https://github.com/pycqa/pylint
    rev: "v3.3.7"
    hooks:
      - id: pylint # Use pylintrc file in repository
        name: Check for Linting errors on Python files outside the Ansible collection.
        description: This hook runs pylint.
        types: [python]
      - id: pylint # Use pylintrc file in Ansible collection
        name: Check for Linting errors on Python files in the Ansible collection.
        description: This hook runs pylint.
        types: [python]
        files: ansible_collections/arista/community/
        args:
          - --rcfile=ansible_collections/arista/community/pylintrc

  - repo: https://github.com/adrienverge/yamllint.git
    rev: "v1.37.1"
    hooks:
      - id: yamllint
        name: Check for Linting errors on YAML files with settings defined in `.github/yamllintrc`.
        description: This hook runs yamllint.
        entry: yamllint
        language: python
        types: [file, yaml]
        args: [--strict, -c=.github/yamllintrc]

  - repo: https://github.com/aristanetworks/j2lint.git
    rev: "v1.2.0"
    hooks:
      - id: j2lint
        name: Check for Linting errors on Jinja2 files

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        name: Check for common misspellings in text files.
        entry: codespell
        language: python
        types: [text]
        args:
          - '--ignore-words=.github/ignore-codespell-words'  # Ignore words listed in this file
        exclude: >  # List of regex patterns for files/directories to exclude
          (?x)^(
            .*\.cfg|  # Exclude all .cfg files
            .*\.svg|  # Exclude all .svg files
            .*\.excalidraw|  # Exclude all .excalidraw files
            .*\.rst|  # Exclude all .rst files
            ansible_collections/arista/community/CHANGELOG.rst| # Exclude auto generated CHANGELOG.rst file
            ansible_collections/arista/community/changelogs/.*|  # Exclude all files in this directory
          )$

  - repo: local
    hooks:

      - id: docs-plugin-modules
        name: Build documentation for collection modules and action plugins.
        entry: >-
          ansible-doc-extractor --template docs/templates/plugin-docs.j2
          --markdown "docs/plugins/Modules_and_action_plugins/"
        language: python
        types: [python]
        additional_dependencies: ['ansible-doc-extractor>=0.1.10', 'ansible-core>=2.16.0,<2.19.0']
        files: ansible_collections/arista/community/plugins/modules/

      - id: docs-plugin-filter
        name: Build documentation for collection filter plugins.
        entry: >-
          ansible-doc-extractor --template docs/templates/plugin-docs.j2
          --markdown "docs/plugins/Filter_plugins/"
        language: python
        types_or: [python, yaml]
        additional_dependencies: ['ansible-doc-extractor>=0.1.10', 'ansible-core>=2.16.0,<2.19.0']
        files: ansible_collections/arista/community/plugins/filter/
        exclude: ^(ansible_collections/arista/community/plugins/filter/deprecated_filters.py)$

      - id: docs-plugin-lookup
        name: Build documentation for collection lookup plugins.
        entry: >-
          ansible-doc-extractor --template docs/templates/plugin-docs.j2
          --markdown "docs/plugins/Lookup_plugins/"
        language: python
        types: [python]
        additional_dependencies: ['ansible-doc-extractor>=0.1.10', 'ansible-core>=2.16.0,<2.19.0']
        files: ansible_collections/arista/community/plugins/lookup/

      - id: docs-plugin-test
        name: Build documentation for collection test plugins.
        entry: >-
          ansible-doc-extractor --template docs/templates/plugin-docs.j2
          --markdown "docs/plugins/Test_plugins/"
        language: python
        types: [python]
        additional_dependencies: ['ansible-doc-extractor>=0.1.10', 'ansible-core>=2.16.0,<2.19.0']
        files: ansible_collections/arista/community/plugins/test/

      - id: docs-plugin-vars
        name: Build documentation for collection var plugins.
        entry: >-
          ansible-doc-extractor --template docs/templates/plugin-docs.j2
          --markdown "docs/plugins/Vars_plugins/"
        language: python
        types: [python]
        additional_dependencies: ['ansible-doc-extractor>=0.1.10', 'ansible-core>=2.16.0,<2.19.0']
        files: ansible_collections/arista/community/plugins/vars/

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    # Keep v0.18.0 for now as pre-commit.ci fails on v0.18.1
    rev: v0.18.1
    hooks:
      - id: markdownlint-cli2
        name: Check for Linting errors on Markdown files with settings defined in `.github/.markdownlint.yaml`.
